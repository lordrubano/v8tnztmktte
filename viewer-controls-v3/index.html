<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Стол EED · пошаговый просмотр</title>
<!-- Пошаговый просмотр всего стола (Э3). Основа — образец шага 1, утверждённый владельцем 01.10.2026.
     Данные — files/data.js (build_viewer_all.py: инструкция.json v0.3.15 + журналы чистовых проходов).
     Клипы: files/clips/sN-rK.mp4 (строки) и sN-result.mp4 (итог шага); только сборка, без вырезок PDF, без субтитров, без звука.
     Голос: files/voice/*.m4a — по кнопке, только утверждённые и прослушанные фразы (voice-approved.json); нет файла — «голос готовится».
     Ссылки: #step=N, #step=N&row=K, #step=N&done. Память: localStorage (если доступна). -->
<style>
@font-face{font-family:"Arimo";src:url(files/LiberationSans-Regular.ttf);font-weight:400}
@font-face{font-family:"Arimo";src:url(files/LiberationSans-Bold.ttf);font-weight:700}
:root{--ink:#24282B;--muted:#5B6066;--page:#EFECEB;--card:#FFFFFF;--line:#DCD9D1;--primary:#2F3332;--on-primary:#FFFFFF;
      --hl:#BD7861;--ok:#287A4E;--warn-bg:#F7F6F2;--r:10px}
*{box-sizing:border-box}
html,body{margin:0;background:var(--page);color:var(--ink);font:400 16px/1.35 Arimo,"Liberation Sans",Arial,sans-serif}
button{font:inherit;color:inherit;cursor:pointer}
.bar{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:14px;height:56px;padding:0 18px;background:var(--card);border-bottom:1px solid var(--line)}
.bar img{height:22px}
.bar .prod{display:flex;flex-direction:column;line-height:1.2}
.bar .prod b{font-size:15px}.bar .prod span{font-size:12px;color:var(--muted)}
.bar .sp{flex:1}
.prog{display:flex;align-items:center;gap:10px;font-weight:700;font-size:14px;color:var(--muted);white-space:nowrap}
.prog .segs{display:flex;gap:5px}
.prog .segs i{width:34px;height:7px;border-radius:4px;background:var(--line)}
.prog .segs i.done{background:var(--hl)}.prog .segs i.cur{background:var(--primary)}
.chips{display:flex;gap:8px;align-items:center;flex:1;justify-content:center;min-width:0;flex-wrap:wrap}
.chips .lbl{font-size:13px;color:var(--muted);margin-right:4px;white-space:nowrap}
.chip{position:relative;width:36px;height:36px;border-radius:50%;border:2px solid var(--line);background:var(--card);font-weight:700;font-size:15px;
      display:flex;align-items:center;justify-content:center;padding:0;flex:none}
.chip.cur{background:var(--primary);border-color:var(--primary);color:#fff}
.chip.done{border-color:var(--ok);color:var(--ok)}
.chip.done.cur{color:#fff}
.chip.soon{border-style:dashed;color:var(--muted);background:transparent}
.chip.soon.cur{background:var(--muted);border-color:var(--muted);color:#fff}
.chip .ck{position:absolute;right:-3px;top:-4px;width:16px;height:16px;border-radius:50%;background:var(--ok);color:#fff;font-size:11px;line-height:16px;text-align:center}
.main{display:grid;grid-template-columns:minmax(0,3fr) minmax(0,2fr);gap:20px;padding:12px 18px 24px;max-width:1400px}      /* колонки делят окно, в окно помещаются при любой ширине (G.12: без горизонтальной прокрутки) */
.main>section,.main>aside{min-width:0}
.title{font-size:24px;font-weight:700;margin:0 0 4px;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.title small{font-size:14px;color:var(--muted);font-weight:400}
.why{font-size:14px;color:var(--muted);margin:0 0 10px}
.clip{position:relative;border-radius:var(--r);overflow:hidden;background:#E6E5E0}
.clip video{display:block;width:100%;height:auto;background:#E6E5E0}
.clip .state{display:flex;align-items:center;gap:10px;background:var(--primary);color:#fff;padding:7px 14px 7px 10px;font-size:13px;font-weight:700}
.clip .state i{display:block;flex:1;height:4px;border-radius:2px;background:rgba(255,255,255,.35);position:relative;overflow:hidden}
.clip .state i b{position:absolute;left:0;top:0;height:4px;width:0;background:#fff}
.warnbox{border-radius:var(--r);background:var(--warn-bg);border-left:8px solid var(--ink);padding:26px 24px;font-size:22px;line-height:1.35}
.warnbox b{display:block;font-size:26px;margin-bottom:8px}
.row{display:grid;grid-template-columns:40px 6px 1fr auto;gap:12px;align-items:center;margin-top:14px;background:var(--card);
     border:2px solid var(--primary);border-radius:var(--r);padding:12px 16px}
.row .n{width:36px;height:36px;border-radius:50%;background:var(--primary);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:18px}
.row .s{width:6px;height:44px;border-radius:3px}
.row .t{font-size:20px;line-height:1.3;font-weight:700}
.row .done{display:flex;align-items:center;gap:6px;height:40px;padding:0 12px;border-radius:999px;border:1.5px solid var(--line);background:var(--card);font-weight:700;font-size:14px;white-space:nowrap}
.row .done.on{background:var(--ok);border-color:var(--ok);color:#fff}
.btns{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}
.b{display:inline-flex;align-items:center;justify-content:center;gap:9px;height:52px;padding:0 18px;border-radius:var(--r);border:1.5px solid var(--line);
   background:var(--card);font-weight:700;font-size:16px}
.b svg{width:22px;height:22px;flex:none}
.b:disabled{opacity:.4;cursor:default}
.b.primary{background:var(--primary);border-color:var(--primary);color:var(--on-primary);margin-left:auto;min-width:150px}
.toast{margin-top:10px;font-size:14px;color:var(--muted);min-height:20px}
.side{display:flex;flex-direction:column;gap:12px}
.box{background:var(--card);border-radius:var(--r);padding:12px 14px}
.box h3{margin:0 0 8px;font-size:14px;display:flex;justify-content:space-between;gap:8px}
.box h3 span{font-weight:400;color:var(--muted);font-size:12px}
.sheet{width:100%;border:1px solid var(--line);border-radius:6px;display:block}
.sheetbox .sheet{height:380px;object-fit:cover;object-position:top;cursor:zoom-in}
.overlay .sheet{height:auto}
.need{display:flex;gap:12px;align-items:center;font-size:15px;margin:4px 0}
.need img{height:46px;width:46px;object-fit:contain;flex:none}
.need .noimg{width:46px;height:46px;flex:none}
.need .k{display:inline-block;width:12px;height:12px;margin-right:6px;vertical-align:0}
.need .tool{font-size:13px;color:var(--muted);margin-top:2px}
.steplist{display:flex;flex-direction:column;gap:6px;margin:0;padding:0;list-style:none}
.steplist li{display:grid;grid-template-columns:24px 5px 1fr 18px;gap:8px;align-items:center;font-size:13px;padding:6px 8px;border-radius:8px;border:1.5px solid transparent;cursor:pointer}
.steplist li.cur{border-color:var(--primary);background:#F5F4F0}
.steplist li .n{width:22px;height:22px;border-radius:50%;border:1.5px solid var(--ink);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700}
.steplist li .s{width:5px;height:18px;border-radius:2px}
.steplist li .c{color:var(--ok);font-weight:700}
.sheetlink{display:none;align-items:center;justify-content:space-between;background:var(--card);border-radius:var(--r);padding:14px;font-weight:700;border:0;width:100%;text-align:left;font-size:16px}
.overlay{position:fixed;inset:0;background:rgba(28,26,25,.75);z-index:20;display:none;align-items:flex-start;justify-content:center;overflow:auto;padding:16px}
.overlay.on{display:flex}
.overlay .panel{background:var(--card);border-radius:var(--r);padding:12px;max-width:760px;width:100%}
.overlay .panel .b{margin-top:10px;width:100%}
.donebox{background:var(--card);border-radius:var(--r);padding:18px 20px;margin-top:12px}
.donebox h2{margin:0;font-size:24px}
.donebox p{color:var(--ink);margin:6px 0 0;font-size:17px}
.donebox .nextbig{margin-top:14px;width:100%;justify-content:space-between;background:var(--primary);color:#fff;border-color:var(--primary);height:58px}
.soonbox{background:var(--card);border-radius:var(--r);padding:20px}
.soonbox h2{margin:0 0 6px;font-size:22px}
.soonbox p{margin:0 0 12px;color:var(--muted)}
.soonbox ol{margin:0;padding-left:22px}
.soonbox li{margin:6px 0;font-size:16px}
.snd{display:flex;gap:10px;margin-top:10px;flex-wrap:wrap}
.rate{display:inline-flex;align-items:center;gap:8px;min-height:44px;font-weight:700;font-size:15px}
.rate select{font:inherit;color:var(--ink);min-height:44px;padding:0 10px;border:1.5px solid var(--line);border-radius:8px;background:var(--card)}
.rate select:focus-visible{outline:3px solid var(--primary);outline-offset:2px}
.tog{display:inline-flex;align-items:center;gap:8px;height:44px;padding:0 16px;border-radius:999px;border:1.5px solid var(--line);background:var(--card);font-weight:700;font-size:15px}
.tog svg{width:20px;height:20px;flex:none}
.tog.on{border-color:var(--primary);background:#F5F4F0}
.tog:not(.on){color:var(--muted)}
.tog:disabled{opacity:.45}
.gate{position:fixed;inset:0;background:rgba(28,26,25,.78);z-index:30;display:none;align-items:center;justify-content:center;padding:18px}
.gate.on{display:flex}
.gpanel{background:var(--card);border-radius:var(--r);padding:24px 22px;max-width:460px;width:100%;text-align:center}
.gpanel h2{margin:0 0 8px;font-size:24px}
.gpanel p{margin:0 0 18px;color:var(--muted)}
.b.big{height:68px;font-size:20px;width:100%;margin:0}
.linkbtn{display:block;margin:14px auto 0;background:none;border:0;color:var(--muted);font-size:14px;text-decoration:underline;padding:6px 10px}
.figbox[hidden]{display:none}
.figbox h3{align-items:center;flex-wrap:wrap}
.figbox h3 .figbtns{display:flex;gap:8px}
.figbox .mini{height:32px;padding:0 12px;border-radius:999px;border:1.5px solid var(--line);background:var(--card);font-weight:700;font-size:13px}
.figbox .mini.phoneonly{display:none}
.figwrap{cursor:default}
.figwrap{max-width:100%;overflow:hidden}
.figwrap svg{width:100%;max-width:100%;height:auto;display:block;border-radius:6px;border:1px solid var(--line);background:#fff}
.figcap{margin-top:8px;font-size:13px;color:var(--muted);min-height:18px}
.side.hasfig .sheetbox{display:none}
/* подсветка текущей строки: остальное приглушено, но не спрятано; пульс ≈ 1 раз в секунду (при reduce-motion — ровная подсветка) */
.figsvg [data-g],.figsvg [data-n]{transition:opacity .3s}
.figsvg.focus [data-g]:not(.hl){opacity:.42}
.figsvg.focus [data-n]:not(.hl){opacity:.5}
.figsvg.focus [data-n][data-k="ld"].hl,.figsvg.focus [data-n][data-k="cl"].hl{opacity:1}
.figsvg.focus g[font-family]>text{opacity:.7}
.figsvg .dashsub>polyline:not(.hl){opacity:.3}
.figsvg .glow{pointer-events:none;animation:glowp 1.1s ease-in-out infinite}
@keyframes glowp{0%,100%{opacity:.22}50%{opacity:.85}}
.figsvg [data-n].hl[data-k="bd"]{animation:ovp 1.1s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes ovp{0%,100%{transform:scale(1)}50%{transform:scale(1.14)}}
@media (prefers-reduced-motion:reduce){
  .figsvg .glow{animation:none;opacity:.7}
  .figsvg [data-n].hl[data-k="bd"]{animation:none;transform:scale(1.1)}
}
.chip.intro{font-style:italic;font-family:Georgia,serif}
.introbox{background:var(--card);border-radius:var(--r);padding:18px 20px}
.introbox h2{margin:0 0 4px;font-size:24px}
.introbox h3{margin:16px 0 8px;font-size:16px;display:flex;align-items:center;gap:8px}
.introbox h3 small{font-weight:400;color:var(--muted)}
.introbox .introsub{margin:0;color:var(--muted);font-size:14px}
.introbox .partsgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.introbox .part{border:1.5px solid var(--line);border-radius:8px;padding:8px;display:flex;gap:10px;align-items:center}
.introbox .part img{width:84px;height:56px;object-fit:contain;flex:none}
.introbox .part b{font-size:20px;margin-right:6px}
.introbox .part small{display:block;color:var(--muted);font-size:12px;line-height:1.25;margin-top:2px}
.introbox .part em{font-style:normal;color:var(--muted);font-size:13px;white-space:nowrap}
.introbox .note{margin:12px 0 0;padding:10px 12px;border:1.5px solid var(--ink);border-radius:8px;font-weight:700;font-size:15px}
.introbox .smallnote{margin:8px 0 0;color:var(--muted);font-size:13px}
.introbox .hwcols{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px 14px}
.introbox .hwgrp{break-inside:avoid}
.introbox .hwgrp h3 i{width:12px;height:12px;border-radius:3px;display:inline-block}
.introbox .hw{display:grid;grid-template-columns:30px minmax(0,1fr) auto;gap:8px;align-items:center;border:1.5px solid var(--line);border-left-width:5px;border-radius:6px;padding:4px 8px;margin:4px 0;font-size:13px}
.introbox .hw img{width:28px;height:28px;object-fit:contain}
.introbox .hw b{font-size:14px;margin-right:4px}
.introbox .hw em{font-style:normal;font-weight:700}
.introbox .hw small{display:block;color:var(--muted);font-size:11px}
.introbox .wl{margin:8px 0;padding:12px 14px;border-radius:8px;background:var(--warn-bg);border-left:6px solid var(--ink);font-size:17px}
.introbox .wl b{margin-right:6px}
.introbox ul.tl{margin:6px 0 0;padding-left:22px;font-size:17px}
.introbox .people{margin:10px 0 0;font-size:17px}
.introbox .stages{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.introbox .stage{border:1.5px solid var(--line);border-radius:8px;padding:10px}
.introbox .stage small{color:var(--muted)}
.introbox .stage b{display:block;font-size:17px;margin:2px 0 4px}
.finalbox h2{font-size:26px}
.finalbox .finalimg{display:block;max-width:100%;max-height:300px;margin:10px auto;border-radius:6px}
.finalbox .mandatory{margin:12px 0;padding:18px 20px;border:3px solid var(--ink);border-radius:10px;font-size:24px;line-height:1.3}
.finalbox .mandatory b{font-size:26px}
.finalbox .mfield{margin-top:12px;min-height:110px;border:2px dashed var(--line);border-radius:10px;padding:10px 14px;color:var(--muted);font-size:13px}
@media (max-width:760px){
  .introbox{margin:0 14px;padding:14px}
  .introbox .partsgrid,.introbox .hwcols,.introbox .stages{grid-template-columns:1fr}
  .finalbox .mandatory{font-size:20px;padding:14px}
  .finalbox .mandatory b{font-size:22px}
}
/* ---------- телефон ---------- */
@media (max-width:760px){
  .bar{position:static;height:auto;padding:8px 14px 10px;flex-wrap:wrap;gap:8px 10px}.bar .prod{display:none}
  .bar .sp{display:none}
  .prog{margin-left:auto}
  .prog .segs i{width:14px}
  .chips{order:3;flex:0 0 100%;gap:4px;justify-content:space-between;flex-wrap:nowrap}
  .chips .lbl{display:none}
  .chip{width:32px;height:32px;font-size:14px}
  .main{display:block;padding:0 0 20px}
  .title{font-size:21px;margin:12px 14px 4px;flex-direction:column;gap:2px}
  .title small{font-size:13px}
  .why{margin:0 14px 10px;font-size:13px}
  .clip{border-radius:0}
  .clip .state{padding:5px 12px 5px 10px;font-size:12px}
  .warnbox{margin:0 14px;font-size:19px;padding:20px 18px}
  .warnbox b{font-size:22px}
  .soonbox{margin:0 14px;padding:16px}
  .donebox{margin:12px 14px 0}
  .row{margin:12px 14px 0;grid-template-columns:34px 6px 1fr;gap:10px;padding:10px 12px}
  .row .done{grid-column:1/-1;justify-self:start}
  .row .n{width:32px;height:32px;font-size:16px}
  .row .t{font-size:18px}
  .btns{margin:12px 14px 0;display:grid;grid-template-columns:1fr 1fr 1.2fr;gap:8px}
  .btns .b{flex-direction:column;gap:3px;height:60px;padding:0 6px;font-size:14px}
  .btns .b.primary{margin:0;min-width:0;order:3}
  .btns .b.prev{order:1}.btns .b.rep{order:2}
  .btns .b.pause,.btns .b.voice{order:4;flex-direction:row;height:48px;gap:8px}
  .btns .b.voice{grid-column:span 2}
  .snd{margin:10px 14px 0;display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .tog{justify-content:center;padding:0 8px;font-size:14px;height:46px}
  .toast{margin:8px 14px 0}
  #figslot{margin:0}
  .figbox.inline{margin:12px 14px 0;padding:10px 12px}
  .figbox.inline .figwrap{max-width:210px;margin:0 auto;cursor:zoom-in}
  .figbox.inline .figcap{text-align:center}
  .figbox.zoom{position:fixed;inset:0;z-index:18;margin:0;border-radius:0;overflow:auto;padding:14px 14px 24px;max-width:none}
  .figbox.zoom .figwrap{max-width:none;margin:0;cursor:default}
  .figbox.zoom .mini.phoneonly{display:inline-block}
  .side{margin:12px 14px 0}
  .sheetbox{display:none}
  .sheetlink{display:flex}
}
</style>
</head>
<body>
<header class="bar">
  <img src="files/img/shatura-logo.svg" alt="Шатура">
  <div class="prod"><b id="prod">Стол EED · 487083</b><span>Инструкция по сборке</span></div>
  <nav class="chips" id="chips" aria-label="Шаги стола"></nav>
  <div class="prog"><span id="progtext"></span><span class="segs" id="segs"></span></div>
</header>
<div class="main">
  <section>
    <h1 class="title"><span id="steptitle"></span><small id="rowof"></small></h1>
    <p class="why" id="why"></p>
    <div id="stage"></div>
    <div id="figslot"></div>
    <div id="rowbox"></div>
    <div class="btns">
      <button class="b prev" id="bprev"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>Назад</button>
      <button class="b rep" id="brep"><svg viewBox="0 0 24 24"><path d="M5 12a7 7 0 1 0 2.1-5" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/><path d="M6 3v4.5h4.5" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>Повтор</button>
      <button class="b pause" id="bpause"><svg viewBox="0 0 24 24"><path d="M8 5v14M16 5v14" stroke="currentColor" stroke-width="2.8" stroke-linecap="round"/></svg><span id="pauselbl">Пауза</span></button>
      <button class="b voice" id="bvoice"><svg viewBox="0 0 24 24"><path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/><path d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>Повтор голосом</button>
      <button class="b primary" id="bnext"><span id="nextlbl">Далее</span><svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    </div>
    <div class="snd">
      <button class="tog on" id="btogvoice" aria-pressed="true"><svg viewBox="0 0 24 24"><path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/><path d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg><span id="togvoicelbl">Голос: вкл</span></button>
      <button class="tog on" id="btogmusic" aria-pressed="true"><svg viewBox="0 0 24 24"><path d="M9 18V6l10-2v12" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="7" cy="18" r="2.4" fill="currentColor"/><circle cx="17" cy="16" r="2.4" fill="currentColor"/></svg><span id="togmusiclbl">Музыка: вкл</span></button>
      <label class="rate" for="bspeed">Скорость <select id="bspeed" aria-label="Скорость клипа и голоса"><option value="0.5">0,5×</option><option value="0.75">0,75×</option><option value="1">1×</option><option value="1.25">1,25×</option><option value="1.5">1,5×</option><option value="1.75">1,75×</option><option value="2">2×</option></select></label>
    </div>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>
  </section>
  <aside class="side" id="side">
    <div class="box figbox" id="figbox" hidden>
      <h3><b id="figttl">Рисунок шага</b><span class="figbtns"><button class="mini" id="bfigfull" type="button">Весь лист</button><button class="mini phoneonly" id="bfigclose" type="button">Закрыть</button></span></h3>
      <div class="figwrap" id="figwrap" role="img" aria-label="Рисунок шага с подсветкой текущей строки"></div>
      <div class="figcap" id="figcap" aria-live="polite"></div>
    </div>
    <div class="box sheetbox"><h3><b id="sheetttl">Наш лист</b> <span>как в коробке</span></h3><img class="sheet" id="sheetimg" alt="Наш лист шага"></div>
    <button class="sheetlink" id="bsheet"><span id="sheetlbl">Наш лист шага</span> <span>›</span></button>
    <div class="box" id="needbox"></div>
    <div class="box"><h3><b id="listttl">В этом шаге</b> <span id="rowscount"></span></h3><ul class="steplist" id="steplist"></ul></div>
  </aside>
</div>
<div class="gate" id="gate" role="dialog" aria-label="Звук"><div class="gpanel"><h2>Пошаговая инструкция</h2><p>Голос расскажет каждый шаг, тихая музыка — фоном. Звук можно выключить кнопками под клипом.</p>
<button class="b primary big" id="bgate" type="button">▶ Начать со звуком</button><button class="linkbtn" id="bmute" type="button">без звука</button></div></div>
<div class="overlay" id="sheetov"><div class="panel"><img class="sheet" id="sheetimg2" alt="Наш лист шага"><button class="b" id="bsheetclose">Закрыть лист</button></div></div>
<script src="files/data.js"></script>
<script>window.VIEWER.storage_key += ":preview:controls-v3";</script>
<script>
(function () {
  "use strict";
  var V = window.VIEWER, STEPS = V.steps;
  var $ = function (id) { return document.getElementById(id); };
  var esc = function (t) { return String(t).replace(/[&<>"]/g, function (c) { return {"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c]; }); };
  // ---------- память устройства (может быть недоступна — страница работает и без неё) ----------
  var store = {cur: "", done: {}};
  try { var raw = window.localStorage.getItem(V.storage_key); if (raw) { var o = JSON.parse(raw); if (o && typeof o === "object") store = o; } } catch (e) {}
  if (!store.done) store.done = {};
  if (typeof store.voice !== "boolean") store.voice = true;      // «Голос: вкл/выкл» и «Музыка: вкл/выкл» — по умолчанию включены, выбор помнится на устройстве
  if (typeof store.music !== "boolean") store.music = true;
  function save() { try { window.localStorage.setItem(V.storage_key, JSON.stringify(store)); } catch (e) {} }
  var SPEEDS = [0.5, 0.75, 1, 1.25, 1.5, 1.75, 2];
  function validSpeed(value) { return typeof value === "number" && SPEEDS.indexOf(value) >= 0 ? value : 1; }
  store.speed = validSpeed(store.speed);
  function applySpeed() {                         // клип и фраза одной скоростью; музыка не меняется
    var speed = validSpeed(store.speed), ok = true;
    [video, vEl].forEach(function (el) {
      if (!el) return;
      try { el.defaultPlaybackRate = speed; el.playbackRate = speed;
        if ("preservesPitch" in el) el.preservesPitch = true;
        else if ("webkitPreservesPitch" in el) el.webkitPreservesPitch = true;
        else if ("mozPreservesPitch" in el) el.mozPreservesPitch = true;
      } catch (e) { ok = false; }
    });
    $("bspeed").value = String(speed);
    if (!ok) toast("Браузер не применил выбранную скорость. Попробуйте 1×.");
  }
  // ---------- все экраны подряд: шаг 1 … шаг 8; у шага без видео — один экран «шаг готовится» ----------
  var ALL = [], INTRO = V.intro, FINAL = V.final;
  if (INTRO) INTRO.screens.forEach(function (s) { ALL.push({st: INTRO, s: s, gid: "s0-" + s.id}); });          // перед шагом 1: «Что в коробке», крепёж, карты, «Подготовка»
  STEPS.forEach(function (st) {
    if (st.ready) st.screens.forEach(function (s) { ALL.push({st: st, s: s, gid: "s" + st.n + "-" + s.id}); });
    else ALL.push({st: st, s: {id: "soon", kind: "soon"}, gid: "s" + st.n + "-soon"});
  });
  if (FINAL) ALL.push({st: FINAL, s: FINAL.screen, gid: "final"});                                               // после шага 8: «Готово»
  function find(gid) { for (var i = 0; i < ALL.length; i++) if (ALL[i].gid === gid) return i; return -1; }
  function stepFirst(n) { for (var i = 0; i < ALL.length; i++) if (ALL[i].st.n === n) return i; return -1; }
  // ссылка на экран: #step=3, #step=3&row=2, #step=3&done
  function fromHash() {
    var h0 = location.hash || "";
    if (h0 === "#final" && FINAL) return find("final");
    var mi = /^#intro(?:=([\w-]+))?$/.exec(h0);
    if (mi && INTRO) { var ii = find("s0-" + (mi[1] || INTRO.screens[0].id)); return ii >= 0 ? ii : 0; }
    var m = /^#step=(\d+)(?:&(?:row=(\d+)|(done)))?$/.exec(location.hash || "");
    if (!m) return -1;
    var n = +m[1], i0 = stepFirst(n);
    if (i0 < 0) return -1;
    if (m[3]) { var d = find("s" + n + "-done"); return d >= 0 ? d : i0; }
    if (m[2]) { var r = find("s" + n + "-row-" + m[2]); return r >= 0 ? r : i0; }
    var f = find("s" + n + "-row-1");
    return f >= 0 ? f : i0;
  }
  function hashOf(it) {
    if (it.st.n === 0) return "#intro=" + it.s.id;
    if (it.s.kind === "final") return "#final";
    var h = "#step=" + it.st.n;
    if (it.s.kind === "row") h += "&row=" + it.s.row;
    else if (it.s.kind === "warning") h += "&row=" + it.s.before_row;
    else if (it.s.kind === "done") h += "&done";
    return h;
  }
  var idx = fromHash();
  if (idx < 0) idx = 0;                                       // адрес без #step (общий QR) открывает первый вводной экран; #step=N — сразу шаг N
  var video = null, paused = false;

  function toast(t) { $("toast").textContent = t || ""; }
  function rowsOf(st) { return st.ready && st.screens ? st.screens.filter(function (s) { return s.kind === "row"; }) : []; }
  function stepDone(st) { var r = rowsOf(st); return r.length > 0 && r.every(function (x) { return store.done["s" + st.n + "-" + x.id]; }); }

  function chips(cur) {
    var h = '<span class="lbl">Шаги стола</span>';
    if (INTRO) h += '<button class="chip intro' + (cur.n === 0 ? " cur" : "") + '" data-n="0" aria-label="Перед сборкой: что в коробке, подготовка">i</button>';
    STEPS.forEach(function (st) {
      var cls = "chip" + (st.n === cur.n ? " cur" : "") + (stepDone(st) ? " done" : "") + (st.ready ? "" : " soon");
      h += '<button class="' + cls + '" data-n="' + st.n + '" aria-label="Шаг ' + st.n + (st.ready ? "" : " (готовится)") + (stepDone(st) ? ", сделан" : "") + '">' + st.n + (stepDone(st) ? '<i class="ck">✓</i>' : "") + '</button>';
    });
    $("chips").innerHTML = h;
    Array.prototype.forEach.call($("chips").querySelectorAll(".chip"), function (b) { b.onclick = function () { go(stepFirst(+b.getAttribute("data-n"))); }; });
  }

  function progress(it) {
    var st = it.st, s = it.s, rows = rowsOf(st), html = "", r = s.kind === "row" ? s.row : (s.kind === "warning" ? s.before_row : rows.length + 1);
    if (st.n === 0) {                                          // вводные экраны: «перед сборкой · k из M»
      INTRO.screens.forEach(function (x, k) { html += '<i class="' + (x === s ? "cur" : (k < INTRO.screens.indexOf(s) ? "done" : "")) + '"></i>'; });
      $("segs").innerHTML = html; $("progtext").textContent = "перед сборкой · " + (INTRO.screens.indexOf(s) + 1) + " из " + INTRO.screens.length; $("rowof").textContent = "";
      return;
    }
    if (s.kind === "final") { $("segs").innerHTML = ""; $("progtext").textContent = "готово"; $("rowof").textContent = ""; return; }
    rows.forEach(function (x) { html += '<i class="' + (store.done["s" + st.n + "-" + x.id] ? "done" : (x.row === r ? "cur" : "")) + '"></i>'; });
    $("segs").innerHTML = html;
    $("progtext").textContent = !st.ready ? "шаг " + st.n + " · готовится" : (s.kind === "done" ? "шаг " + st.n + " · итог" : "шаг " + st.n + " · " + r + " из " + rows.length);
    $("rowof").textContent = s.kind === "row" ? "строка " + s.row + " из " + rows.length : (s.kind === "warning" ? "перед строкой " + s.before_row : "");
  }

  function steplist(it) {
    var st = it.st, html = "";
    $("listttl").textContent = st.n === 0 ? "Экраны перед сборкой" : (it.s.kind === "final" ? "Экран" : "В этом шаге");
    if (st.n === 0 || it.s.kind === "final") {
      var list = st.n === 0 ? INTRO.screens : [it.s];
      $("rowscount").textContent = st.n === 0 ? list.length + " экранов" : "";
      list.forEach(function (x, k) { var gid = st.n === 0 ? "s0-" + x.id : "final"; html += '<li data-g="' + gid + '" class="' + (it.s === x ? "cur" : "") + '"><span class="n">' + (k + 1) + '</span><i class="s" style="background:#DCD9D1"></i><span>' + esc(x.title) + '</span><span></span></li>'; });
      $("steplist").innerHTML = html;
      Array.prototype.forEach.call($("steplist").children, function (li) { li.onclick = function () { var i = find(li.getAttribute("data-g")); if (i >= 0) go(i); }; });
      return;
    }
    $("rowscount").textContent = st.rows_total + (st.rows_total === 1 ? " строка" : (st.rows_total < 5 ? " строки" : " строк"));
    if (st.ready) {
      st.screens.forEach(function (x) {
        if (x.kind !== "row") return;
        var gid = "s" + st.n + "-" + x.id;
        html += '<li data-g="' + gid + '" class="' + (it.s === x ? "cur" : "") + '"><span class="n">' + x.row + '</span><i class="s" style="background:' + x.color + '"></i>' +
                '<span>' + esc(x.text.split(" — ")[0]) + '</span><span class="c">' + (store.done[gid] ? "✓" : "") + '</span></li>';
      });
    } else {
      st.rows_text.forEach(function (x) {
        html += '<li data-g="' + "s" + st.n + "-soon" + '"><span class="n">' + x.row + '</span><i class="s" style="background:#DCD9D1"></i><span>' + esc(x.text.split(" — ")[0]) + '</span><span></span></li>';
      });
    }
    $("steplist").innerHTML = html;
    Array.prototype.forEach.call($("steplist").children, function (li) { li.onclick = function () { var i = find(li.getAttribute("data-g")); if (i >= 0) go(i); }; });
  }

  function need(it) {
    var s = it.s, st = it.st, nx = STEPS[st.n];
    $("needbox").style.display = (st.n === 0 || s.kind === "final") ? "none" : "";
    if (st.n === 0 || s.kind === "final") return;
    if (s.kind !== "row") {
      var msg = s.kind === "warning" ? "Прочтите предупреждение — дальше строка " + s.before_row + "." :
                (s.kind === "done" ? "Шаг " + st.n + " собран. Дальше — следующий шаг." : "Видео этого шага готовится. Пока — по нашему листу шага " + st.n + ".");
      $("needbox").innerHTML = '<h3>Что нужно</h3><div class="need" style="color:var(--muted)">' + msg + '</div>';
      return;
    }
    var h = '<h3>Что нужно</h3>';
    s.need.forEach(function (n) {
      h += '<div class="need">' + (n.img ? '<img src="' + n.img + '" alt="">' : '<span class="noimg"></span>') + '<div><span class="k" style="background:' + n.color + '"></span><b>' + esc(n.name) + '</b> · ' + n.qty + ' шт.' +
           (s.tool && n === s.need[0] ? '<div class="tool">инструмент: ' + esc(s.tool) + '</div>' : '') + '</div></div>';
    });
    $("needbox").innerHTML = h;
  }

  // ---------- звук: голос сопровождает экран сам, музыка тихо фоном (К7.25 E.24, F.8, F.17) ----------
  // Браузер не даёт звука без нажатия: пока нажатия не было, на экране большая кнопка «Начать со звуком» и мелкая «без звука».
  var unlocked = false;                    // было нажатие — звук разрешён
  var runId = 0, clipEnded = false, voiceActive = false, voiceFinished = false;
  var mediaStart = null;
  var MEDIA_TEXT = {"ui.media_load_error": "Не удалось загрузить клип или голос. Нажмите «Повтор» или перейдите дальше.", "ui.media_loading": "загрузка", "ui.media_error_state": "ошибка загрузки"};
  var vEl = new Audio();                   // один элемент голоса на всю страницу (так он остаётся «разблокированным» и на телефоне)
  vEl.preload = "auto";
  vEl.addEventListener("ended", function () { voiceActive = false; voiceFinished = true; updateState(); });
  vEl.addEventListener("pause", function () { voiceActive = false; updateState(); });
  function playEl(el) { try { var p = el.play(); if (p && p.catch) p.catch(function () {}); } catch (e) {} }
  function saveSnd() { save(); }
  function voiceWanted(s) { return unlocked && store.voice && !!s.voice; }

  // Музыка — отдельный непрерывный слой: стартует один раз («Начать со звуком») и играет до конца; переходы «Далее/Назад», смена строки, шага,
  // итог шага, «Повтор» её НЕ трогают (render/startMedia/stopMedia о музыке не знают). Громкость меняется только плавно (applyMusic):
  // старт 2 с, «Пауза»/«Продолжить» 0,8 с, выключатель 0,5 с, скрытая вкладка — затухание и пауза, возврат — нарастание, «Готово» после шага 8 — 3 с.
  // Трек — цикл без шва (WebAudio, loop); голос — отдельный слой поверх, на 18 дБ громче (уровень файла музыки уже ниже на 18 LU).
  var music = {ctx: null, gain: null, src: null, buf: null, el: null, loading: false, level: 0, timer: 0, ramp: 0};
  var hiddenTab = false;
  var wasFinal = false;
  function finalScreen() { return ALL[idx].s.kind === "final"; }          // «Готово»: последний шаг пройден
  function musicWanted() { return unlocked && store.music && !!V.music && !paused && !hiddenTab && !finalScreen(); }
  function setGain(level, sec) {
    music.level = level;
    if (music.gain) {
      var g = music.gain.gain, t = music.ctx.currentTime;
      try { g.cancelScheduledValues(t); g.setValueAtTime(g.value, t); g.linearRampToValueAtTime(level, t + sec); } catch (e) {}
    } else if (music.el) {
      clearInterval(music.ramp);
      var from = music.el.volume, t0 = Date.now();
      music.ramp = setInterval(function () {
        var k = Math.min(1, (Date.now() - t0) / (sec * 1000));
        try { music.el.volume = Math.max(0, Math.min(1, from + (level - from) * k)); } catch (e) {}
        if (k >= 1) clearInterval(music.ramp);
      }, 50);
    }
  }
  function applyMusic(sec) {
    var want = musicWanted();
    clearTimeout(music.timer);
    if (!V.music || !unlocked) return;
    if (want) {
      musicStart(sec);
      if (music.ctx && music.ctx.state === "suspended" && music.ctx.resume) { try { music.ctx.resume(); } catch (e) {} }
      if (music.el && music.el.paused) playEl(music.el);
      if (music.src || music.el) setGain(1, sec);          // трек ещё не стартовал (грузится) — громкость задаст сам старт
    } else {
      if (music.src || music.el) setGain(0, sec);
      music.timer = setTimeout(function () {           // после затухания — настоящая пауза (позиция трека сохраняется)
        if (musicWanted()) return;
        if (music.ctx && music.ctx.state === "running" && music.ctx.suspend) { try { music.ctx.suspend(); } catch (e) {} }
        if (music.el) { try { music.el.pause(); } catch (e) {} }
      }, sec * 1000 + 60);
    }
  }
  function musicStart(sec) {
    if (!V.music || !unlocked || music.src || (music.el && !music.el.paused) || music.loading) return;
    var AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) {
      if (!music.el) { music.el = new Audio(V.music); music.el.loop = true; music.el.volume = 0; }
      playEl(music.el); setGain(1, sec); return;
    }
    if (!music.ctx) { music.ctx = new AC(); music.gain = music.ctx.createGain(); music.gain.gain.value = 0; music.gain.connect(music.ctx.destination); }
    try { if (music.ctx.resume) music.ctx.resume(); } catch (e) {}
    var begin = function () {
      if (music.src || !musicWanted()) return;
      var src = music.ctx.createBufferSource();
      src.buffer = music.buf; src.loop = true; src.connect(music.gain);
      music.gain.gain.setValueAtTime(0, music.ctx.currentTime);
      src.start(0); music.src = src;
      setGain(1, sec || 2);
    };
    if (music.buf) { begin(); return; }
    music.loading = true;
    fetch(V.music).then(function (r) { if (!r.ok) throw new Error("music"); return r.arrayBuffer(); })
      .then(function (ab) { return new Promise(function (ok, bad) { var pr = music.ctx.decodeAudioData(ab, ok, bad); if (pr && pr.then) pr.then(ok, bad); }); })
      .then(function (buf) { music.buf = buf; music.loading = false; begin(); })
      .catch(function () { music.loading = false; V.music = null; refreshSnd(); });
  }

  function refreshSnd() {
    var vb = $("btogvoice"), mb = $("btogmusic");
    vb.setAttribute("aria-pressed", store.voice ? "true" : "false"); vb.classList.toggle("on", !!store.voice);
    $("togvoicelbl").textContent = "Голос: " + (store.voice ? "вкл" : "выкл");
    mb.setAttribute("aria-pressed", store.music ? "true" : "false"); mb.classList.toggle("on", !!store.music);
    $("togmusiclbl").textContent = V.music ? "Музыка: " + (store.music ? "вкл" : "выкл") : "Музыка: нет";
    mb.disabled = !V.music;
  }

  function unlock() {                       // первое нажатие: звук разрешён, экран стартует заново — уже со звуком
    if (unlocked) return;
    unlocked = true;
    $("gate").classList.remove("on");
    try { vEl.muted = false; } catch (e) {}
    applyMusic(2);                                           // старт музыки — нарастание 2 с
    startMedia();
  }

  function cancelMediaStart() {
    runId++;
    var old = mediaStart; mediaStart = null;
    if (old) old.cancel.forEach(function (cancel) { cancel(); });
  }
  function ready(el, ticket) {
    return new Promise(function (ok) {
      var done = false;
      function finish(value) {
        if (done) return; done = true;
        el.removeEventListener("canplay", check); el.removeEventListener("seeked", check); el.removeEventListener("error", failed);
        ok(value);
      }
      function check() { if (el.error) finish(false); else if (el.readyState >= 3 && !el.seeking) finish(true); }
      function failed() { finish(false); }
      ticket.cancel.push(function () { finish(false); });
      el.addEventListener("canplay", check); el.addEventListener("seeked", check); el.addEventListener("error", failed);
      check();
    });
  }
  // Ждём реальные canplay/seeked; таймер не выдаёт неготовый поток за готовый.
  function queueMedia(clip, withVoice, allowPaused) {
    cancelMediaStart();
    toast("");
    if (!clip && !withVoice) return;
    var ticket = {id: runId, cancel: [], failed: false}, waits = [];
    mediaStart = ticket;
    function clearWaits() { ticket.cancel.splice(0).forEach(function (cancel) { cancel(); }); }
    function fail() {
      if (mediaStart !== ticket || ticket.id !== runId || ticket.failed) return;
      ticket.failed = true;
      clearWaits();
      toast(MEDIA_TEXT["ui.media_load_error"]);
    }
    function waitFor(el) {
      if (ticket.failed) return;
      // Следим за ошибкой до общего старта, даже если этот поток уже сообщил canplay.
      el.addEventListener("error", fail);
      ticket.cancel.push(function () { el.removeEventListener("error", fail); });
      waits.push(ready(el, ticket));
      if (el.error) fail();
    }
    if (clip) waitFor(clip);
    if (withVoice) waitFor(vEl);
    Promise.all(waits).then(function (results) {
      if (mediaStart !== ticket || ticket.id !== runId || ticket.failed || (paused && !allowPaused)) return;
      if (results.some(function (value) { return !value; })) { fail(); return; }
      clearWaits();
      mediaStart = null;
      applySpeed();
      if (clip) playEl(clip);
      if (withVoice && voiceWanted(ALL[idx].s)) { voiceActive = true; playEl(vEl); }
    });
  }
  // Пауза до seek: уже играющий клип не уходит вперёд, пока загружается фраза.
  function startMedia() {
    cancelMediaStart();
    var s = ALL[idx].s;
    clipEnded = false; voiceFinished = false; voiceActive = false;
    try { vEl.pause(); } catch (e) {}
    if (video) { try { video.pause(); video.currentTime = 0; } catch (e) {} }
    var wantV = voiceWanted(s);
    if (wantV) { vEl.src = s.voice; try { vEl.load(); } catch (e) {} }
    applySpeed();
    queueMedia(video, wantV, false);
  }

  function stopMedia() {
    cancelMediaStart();
    try { vEl.pause(); } catch (e) {}
    voiceActive = false;
    if (video) { try { video.pause(); } catch (e) {} }
  }

  // состояние под клипом: «клип закончился» — только когда закончились и клип, и фраза (фраза длиннее клипа: последний кадр держится)
  // ---------- рисунок шага с подсветкой текущей строки ----------
  // Справа — ровно рисунок нашего PDF (его вёрстка: номера и овалы там же, где в PDF, рисунок только крупнее). Подсветка — слой поверх в тех же координатах:
  // классы на готовых группах (data-g, data-n) и их копии-«свечение» (glow). Ничего не перерисовывается. Рисунок шага подгружается файлом files/fig/sN.js.
  var side = $("side"), mqPhone = window.matchMedia ? window.matchMedia("(max-width:760px)") : {matches: false};
  var figLoading = {};
  function figPlace() {
    var box = $("figbox"), slot = $("figslot");
    if (mqPhone.matches) { if (box.parentNode !== slot) slot.appendChild(box); box.classList.add("inline"); }
    else { if (box.parentNode !== side) side.insertBefore(box, side.firstChild); box.classList.remove("inline", "zoom"); }
  }
  if (mqPhone.addEventListener) mqPhone.addEventListener("change", figPlace); else if (mqPhone.addListener) mqPhone.addListener(figPlace);
  function figGet(st, cb) {                                   // рисунок шага: уже загружен или грузим файл
    window.FIGS = window.FIGS || {};
    if (window.FIGS[st.n]) { cb(window.FIGS[st.n]); return; }
    if (figLoading[st.n]) { figLoading[st.n].push(cb); return; }
    figLoading[st.n] = [cb];
    var sc = document.createElement("script");
    sc.src = st.fig.js;
    sc.onload = function () { var q = figLoading[st.n]; figLoading[st.n] = null; q.forEach(function (f) { f(window.FIGS[st.n]); }); };
    sc.onerror = function () { var q = figLoading[st.n]; figLoading[st.n] = null; q.forEach(function (f) { f(null); }); };
    document.head.appendChild(sc);
  }
  function figShow(it) {
    var box = $("figbox"), st = it.st;
    if (!st.fig) { box.hidden = true; side.classList.remove("hasfig"); return; }
    $("figttl").textContent = "Рисунок · шаг " + st.n;
    box.hidden = false; side.classList.add("hasfig");
    figPlace();
    figGet(st, function (svg) {
      if (ALL[idx] !== it) return;                              // за время загрузки экран сменился
      if (!svg) { box.hidden = true; side.classList.remove("hasfig"); return; }
      if (box.getAttribute("data-step") !== String(st.n)) { $("figwrap").innerHTML = svg; box.setAttribute("data-step", String(st.n)); }
      figHighlight(it, $("figwrap").querySelector("svg"));
    });
  }
  function q(svg, sel) { return Array.prototype.slice.call(svg.querySelectorAll(sel)); }
  function figHighlight(it, svg) {
    if (!svg) return;
    q(svg, ".glow").forEach(function (g) { g.parentNode.removeChild(g); });
    q(svg, ".hl,.dashsub").forEach(function (g) { g.classList.remove("hl"); g.classList.remove("dashsub"); });
    q(svg, "[data-n] rect").forEach(function (r) { r.style.strokeWidth = ""; });
    svg.classList.remove("focus");
    $("figcap").textContent = "";
    var s = it.s, spec = s.kind === "row" && it.st.fig.rows[s.row];
    if (!spec) return;                                           // «Внимание!», итог шага: рисунок ровно, без пульса
    var color = spec.color || "#197D87", did = false;
    var glow = function (g, w) {                                  // свечение — копия группы цветом вида крепежа, пульсирует
      var c = g.cloneNode(true);
      c.removeAttribute("data-g"); c.setAttribute("class", "glow"); c.setAttribute("stroke", color);
      c.setAttribute("stroke-width", String(w)); c.setAttribute("stroke-linecap", "round"); c.setAttribute("stroke-linejoin", "round");
      Array.prototype.forEach.call(c.querySelectorAll("*"), function (n) { n.removeAttribute("stroke-dasharray"); n.removeAttribute("stroke"); n.removeAttribute("stroke-width"); });
      g.parentNode.insertBefore(c, g);
    };
    var byG = function (n) { return svg.querySelector('[data-g="' + n.replace(/"/g, '\\"') + '"]'); };
    (spec.outline || []).forEach(function (n) { var g = byG(n); if (g) { g.classList.add("hl"); glow(g, 34); did = true; } });
    (spec.part || []).forEach(function (n) { var g = byG(n); if (g) { g.classList.add("hl"); if (n.indexOf("линии-") === 0 && n.indexOf("контур") > 0) glow(g, 30); did = true; } });
    var dash = spec.dash || {};
    Object.keys(dash).forEach(function (n) {                       // штриховые линии строки: остальные линии той же группы приглушены
      var g = byG(n); if (!g) return;
      var lines = g.querySelectorAll("polyline");
      g.classList.add("hl"); g.classList.add("dashsub");
      dash[n].forEach(function (k) { if (lines[k]) lines[k].classList.add("hl"); });
      if (n.indexOf("-обводка") > 0) {
        var c = g.cloneNode(false); c.setAttribute("class", "glow"); c.removeAttribute("data-g");
        dash[n].forEach(function (k) { if (lines[k]) { var l = lines[k].cloneNode(true); l.removeAttribute("stroke-dasharray"); l.removeAttribute("stroke"); l.removeAttribute("stroke-width"); c.appendChild(l); } });
        c.setAttribute("stroke", color); c.setAttribute("stroke-width", "30"); c.setAttribute("stroke-linecap", "round"); c.setAttribute("fill", "none");
        g.parentNode.insertBefore(c, g);
      }
      did = true;
    });
    if (spec.shape) {                                              // ярлык: его прямоугольник на рисунке (из данных рисунка PDF) — пульсирующая заливка и контур
      var ns = "http://www.w3.org/2000/svg", pg = document.createElementNS(ns, "polygon");
      pg.setAttribute("points", spec.shape); pg.setAttribute("class", "glow shape"); pg.setAttribute("fill", color); pg.setAttribute("fill-opacity", "0.35");
      pg.setAttribute("stroke", color); pg.setAttribute("stroke-width", "14"); pg.setAttribute("stroke-linejoin", "round");
      svg.appendChild(pg); did = true;
    }
    var labels = [];
    (spec.holes || []).forEach(function (h) {
      q(svg, '[data-n][data-k="bd"]').forEach(function (g) {
        if (g.getAttribute("data-n") !== h) return;
        g.classList.add("hl"); did = true;
        var r = g.querySelector("rect"); if (r) { r.style.strokeWidth = String(parseFloat(r.getAttribute("stroke-width") || "6") * 1.7); labels.push(r.getAttribute("data-label")); }
      });
      q(svg, '[data-n][data-k="ld"]').forEach(function (g) { if (g.getAttribute("data-n") === h) g.classList.add("hl"); });
    });
    if (spec.callout) q(svg, '[data-n^="' + spec.callout + '"]').forEach(function (g) { g.classList.add("hl"); did = true; });
    if (!did) return;
    svg.classList.add("focus");
    $("figcap").textContent = "Подсвечено: " + (spec.name || "") + (labels.length && labels.length <= 6 ? " · отверстия " + labels.join(", ") : "");
  }
  $("bfigfull").onclick = function () { $("sheetov").classList.add("on"); };
  $("bfigclose").onclick = function () { $("figbox").classList.remove("zoom"); };
  $("figwrap").onclick = function () { var b = $("figbox"); if (b.classList.contains("inline")) b.classList.add("zoom"); };
  $("figwrap").onkeydown = function (e) { if (e.key === "Enter" || e.key === " ") { var b = $("figbox"); if (b.classList.contains("inline")) b.classList.add("zoom"); } };

  function updateState() {
    var s = ALL[idx].s;
    if (video && (s.kind === "row" || s.kind === "done")) {
      var bar = document.querySelector(".clip .state i b"), stx = document.querySelector(".clip .state span");
      if (bar && video.duration) bar.style.width = (clipEnded ? 100 : Math.min(100, 100 * video.currentTime / video.duration)) + "%";
      if (stx) {
        var t = paused ? "пауза" : (clipEnded && s.kind !== "done" ? (voiceActive ? "идёт голос" : "клип закончился") : (s.kind === "done" ? "итог шага" : "идёт клип"));
        if (!paused && mediaStart && video.paused && !clipEnded) t = MEDIA_TEXT[mediaStart.failed ? "ui.media_error_state" : "ui.media_loading"];
        if (stx.textContent !== t) stx.textContent = t;
      }
    }
  }
  function tick() { updateState(); window.requestAnimationFrame(tick); }

  function clipHtml(s) {
    return '<div class="clip"><video muted playsinline preload="auto" ' + (s.kind === "done" ? "loop " : "") + 'width="' + s.clip_w + '" height="' + s.clip_h + '" src="' + s.clip + '"></video>' +
      '<div class="state"><svg viewBox="0 0 24 24" width="16" height="16"><path d="M7 5l12 7-12 7z" fill="#fff"/></svg><span>идёт клип</span><i><b></b></i></div></div>';
  }

  function render() {
    stopMedia();
    var it = ALL[idx], s = it.s, st = it.st, nextSt = STEPS[st.n];
    store.cur = it.gid; save();
    try { var h = hashOf(it); if (location.hash !== h) history.replaceState(null, "", h); } catch (e) {}
    var plain = st.n === 0 || s.kind === "final";
    $("steptitle").textContent = st.n === 0 ? "Перед сборкой" : (s.kind === "final" ? "Готово" : "Шаг " + st.n + " · " + st.title);
    $("why").textContent = (!plain && st.why) ? "Зачем: " + st.why : "";
    var sh = s.sheet || st.sheet;
    $("sheetimg").src = sh; $("sheetimg2").src = sh;
    $("sheetttl").textContent = plain ? "Наша страница · " + (s.sheet_name || "PDF") : "Наш лист · шаг " + st.n;
    $("sheetlbl").textContent = plain ? "Наша страница: " + (s.sheet_name || "PDF") : "Наш лист шага " + st.n;
    chips(st); progress(it); steplist(it); need(it); toast("");
    figShow(it);
    paused = false; $("pauselbl").textContent = "Пауза";
    var stage = $("stage"), rowbox = $("rowbox");
    video = null; rowbox.innerHTML = "";
    if (s.kind === "row") {
      stage.innerHTML = clipHtml(s);
      video = stage.querySelector("video");
      var dk = it.gid;
      rowbox.innerHTML = '<div class="row"><span class="n">' + s.row + '</span><i class="s" style="background:' + s.color + '"></i><span class="t">' + esc(s.text) + '</span>' +
        '<button class="done' + (store.done[dk] ? " on" : "") + '" id="bdone">' + (store.done[dk] ? "✓ Сделано" : "Отметить: сделано") + '</button></div>';
      $("bdone").onclick = function () {                       // отметка — без перезапуска клипа и голоса
        if (store.done[dk]) delete store.done[dk]; else store.done[dk] = 1;
        save(); this.classList.toggle("on", !!store.done[dk]); this.textContent = store.done[dk] ? "✓ Сделано" : "Отметить: сделано";
        chips(st); progress(it); steplist(it);
      };
    } else if (s.kind === "intro" || s.kind === "final") {
      stage.innerHTML = '<div class="introbox' + (s.kind === "final" ? " finalbox" : "") + '">' + s.html + '</div>';
    } else if (s.kind === "warning") {
      stage.innerHTML = '<div class="warnbox"><b>Внимание!</b>' + esc(s.text) + '</div>';
    } else if (s.kind === "done") {
      stage.innerHTML = (s.clip ? clipHtml(s) : "") + '<div class="donebox"><h2>Шаг ' + st.n + ' сделан</h2><p>' + esc(s.text) + '</p>' +
        (nextSt ? '<button class="b nextbig" id="bbig"><span>Следующий шаг: ' + nextSt.n + ' · ' + esc(nextSt.title) + (nextSt.ready ? "" : " (видео готовится)") + '</span><svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg></button>' : '<button class="b nextbig" id="bbig"><span>Дальше: Готово</span><svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg></button>') + '</div>';
      video = stage.querySelector("video");
      if ($("bbig")) $("bbig").onclick = function () { go(idx + 1); };
    } else {
      var rt = "";
      st.rows_text.forEach(function (x) { rt += "<li>" + esc(x.text) + "</li>"; });
      stage.innerHTML = '<div class="soonbox"><h2>Видео шага ' + st.n + ' готовится</h2><p>Пока этот шаг можно собрать по нашему листу (справа или кнопка «Наш лист шага ' + st.n + '»). Строки шага:</p><ol>' + rt + '</ol></div>';
    }
    if (video) video.addEventListener("ended", function () { if (!video || video.loop) return; clipEnded = true; updateState(); });
    var nxtIt = ALL[idx + 1];
    $("nextlbl").textContent = (st.n === 0 && nxtIt && nxtIt.st.n !== 0) ? "К шагу 1" : (s.kind === "done" || s.kind === "soon" ? (STEPS[st.n] ? "Следующий шаг" : "Готово") : (nxtIt && nxtIt.s.kind === "done" ? "Итог шага" : "Далее"));
    $("bprev").disabled = idx === 0;
    $("bnext").disabled = idx === ALL.length - 1;
    $("brep").disabled = !video && !s.voice;
    $("bpause").disabled = !video && !s.voice;
    $("bvoice").disabled = s.kind === "soon";
    refreshSnd();
    window.scrollTo(0, 0);
    startMedia();
    var fin = finalScreen();
    if (fin !== wasFinal) { wasFinal = fin; applyMusic(fin ? 3 : 0.8); }       // «Готово» после последнего шага — затухание 3 с; ушли с него — нарастание
  }
  function go(i) { if (i < 0) return; idx = Math.min(Math.max(0, i), ALL.length - 1); render(); }

  // ---------- кнопки ----------
  $("bspeed").onchange = function () { store.speed = validSpeed(Number(this.value)); save(); applySpeed(); };
  $("bprev").onclick = function () { go(idx - 1); };
  $("bnext").onclick = function () { go(idx + 1); };
  $("brep").onclick = function () { paused = false; $("pauselbl").textContent = "Пауза"; startMedia(); };            // клип и фраза — заново, вместе
  $("bpause").onclick = function () {
    if (paused) { paused = false; $("pauselbl").textContent = "Пауза"; queueMedia(video && !clipEnded ? video : null, voiceWanted(ALL[idx].s) && !voiceFinished, false); applyMusic(0.8); }
    else { paused = true; cancelMediaStart(); $("pauselbl").textContent = "Продолжить"; if (video) { try { video.pause(); } catch (e) {} } try { vEl.pause(); } catch (e) {} applyMusic(0.8); }
  };
  $("bvoice").onclick = function () {                      // «Повтор голосом»: только фраза, клип не трогаем
    var s = ALL[idx].s;
    if (!s.voice) { toast("Голос для этого места готовится — пока смотрите клип и читайте строку."); return; }
    if (!store.voice) { toast("Голос выключен — включите кнопкой «Голос»."); return; }
    unlocked = true; $("gate").classList.remove("on");
    cancelMediaStart();
    try { vEl.pause(); } catch (e) {}
    vEl.src = s.voice; try { vEl.load(); } catch (e) {}
    voiceFinished = false; voiceActive = false; applySpeed(); queueMedia(null, true, true);
  };
  $("btogvoice").onclick = function () {
    store.voice = !store.voice; saveSnd(); refreshSnd();
    if (!store.voice) { cancelMediaStart(); try { vEl.pause(); } catch (e) {} voiceActive = false; if (video && video.paused && !paused && !clipEnded) queueMedia(video, false, false); }
    else { var first = !unlocked; unlocked = true; $("gate").classList.remove("on"); if (first) applyMusic(2); startMedia(); }
  };
  $("btogmusic").onclick = function () {
    store.music = !store.music; saveSnd(); refreshSnd();
    var first = !unlocked;
    if (store.music && first) { unlocked = true; $("gate").classList.remove("on"); }
    applyMusic(first && store.music ? 2 : 0.5);              // выключатель — затухание/нарастание 0,5 с
    if (first && store.music) startMedia();
  };
  $("bgate").onclick = function () { unlock(); };
  $("bmute").onclick = function () { store.voice = false; store.music = false; saveSnd(); refreshSnd(); $("gate").classList.remove("on"); cancelMediaStart(); try { vEl.pause(); } catch (e) {} voiceActive = false; if (video && video.paused && !paused && !clipEnded) queueMedia(video, false, false); applyMusic(0.5); };
  $("bsheet").onclick = function () { $("sheetov").classList.add("on"); };
  $("sheetimg").onclick = function () { $("sheetov").classList.add("on"); };
  $("bsheetclose").onclick = function () { $("sheetov").classList.remove("on"); };
  document.addEventListener("visibilitychange", function () {
    hiddenTab = document.visibilityState !== "visible";
    if (!hiddenTab && !mediaStart && video && !paused && video.paused && !clipEnded) playEl(video);
    applyMusic(hiddenTab ? 0.5 : 0.8);                       // вкладка скрыта — затухание и пауза, возврат — нарастание
  });
  window.addEventListener("hashchange", function () { var i = fromHash(); if (i >= 0 && i !== idx) go(i); });
  // нажатия по шагам и спискам — тоже нажатие пользователя: звук разрешается без отдельной кнопки
  document.addEventListener("click", function (ev) {
    if (!unlocked && (store.voice || store.music) && ev.target && ev.target.closest && !ev.target.closest("#gate") && !ev.target.closest(".snd")) {
      unlocked = true; $("gate").classList.remove("on"); applyMusic(2);
    }
  }, true);
  if ((store.voice || store.music) && (V.music || ALL.some(function (x) { return x.s.voice; }))) $("gate").classList.add("on");
  render();
  window.requestAnimationFrame(tick);
})();
</script>
</body>
</html>
